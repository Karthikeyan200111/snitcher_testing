    <style>

  <body>
    <h1>Start Your Free Trial</h1>

    <form id="free-trial-form" action="#" method="POST">
      <!-- Visible form fields -->
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Work Email *</label>
      <input type="email" id="email" name="email" required />

      <label for="company"
        >Company Name (optional - will be auto-filled if detected)</label
      >
      <input type="text" id="visible_company" name="company" />

      <button type="submit">Start Free Trial</button>
      <button type="button" id="detect_company_btn">Detect Company</button>
      <p id="detected_company" class="note"></p>

      <p class="note">
        This is a demo form. On submission, check your backend or form handler
        to see the hidden Snitcher fields populated with company data (if a
        business visitor is detected).
      </p>
    </form>

    <script>
      window.addEventListener("load", function () {
        function generateBiId() {
          var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

          var rnd = (window.crypto || window.msCrypto).getRandomValues(new Uint8Array(10));
          //change the prefix according the product BI - boldbi, BR - BoldReport 
          return (
            "BI-" +        
            Array.from(rnd)
              .map(function (b) {
                return CHARS[b % CHARS.length];
              })
              .join("")
          );
        }

        // Generate BI id solely from crypto; ignore any server-provided IDs.
        var biId = generateBiId();

        if (window.Snitcher && typeof window.Snitcher.track === "function") {
          window.Snitcher.track("Custom Event", {
            userId: biId,
          });
        }
        console.log("Userid",biId)
      });
    </script>
  </body>
